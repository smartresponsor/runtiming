name: build-test-gate

on:
  push:
    branches: ["master"]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'Test/**'
      - 'config/**'
      - 'resource/**'
      - 'tools/**'
      - 'docs/**'
      - 'ops/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'
  pull_request:
    branches: ["master"]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'Test/**'
      - 'config/**'
      - 'resource/**'
      - 'tools/**'
      - 'docs/**'
      - 'ops/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-gate:
    runs-on: ubuntu-22.04

    env:
      COMPOSER_NO_INTERACTION: '1'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP + Composer cache
        uses: ./.github/actions/php-runtime-setup
        with:
          php-version: '8.4'
          install-deps: 'true'

      - name: Run unit tests
        run: |
          mkdir -p report/runtime/ci
          vendor/bin/phpunit -c phpunit.xml.dist --log-junit report/runtime/ci/junit.xml

      - name: Run runtime gate
        run: |
          export RUNTIME_GATE_OUT_DIR="${GITHUB_WORKSPACE}/report/runtime/ci/gate"
          bash tools/runtime/gate/run-rc-gate.sh

      - name: Upload CI evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-gate-evidence
          if-no-files-found: warn
          path: |
            report/runtime/ci/junit.xml
            report/runtime/ci/gate/**
